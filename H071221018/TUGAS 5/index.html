
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Tugas Tim Marsha</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .member-active {
      background: #e8efff;
      color: #2856c7;
      border-color: #d7e3ff;
    }

    .task-done .task-title {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .task-row {
      margin: 0 !important;
      padding-top: 4px !important;
      padding-bottom: 4px !important;
    }

    #tasks-list {
      margin: 0;
      padding: 0;
    }

    #tasks-list > li {
      min-height: 0;
    }

    #tasks-status.hidden {
      display: none !important;
    }

    /* Tampilan pesan koneksi terputus */
    #tasks-error.hidden {
      display: none !important;
    }

    #tasks-error-message {
      margin-bottom: 5px;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

  <main class="mx-auto grid min-h-screen max-w-7xl grid-cols-1 gap-4 p-4 md:grid-cols-[250px_minmax(0,1fr)] md:p-6">

    <!-- DAFTAR ANGGOTA -->
    <aside class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">

      <div class="mb-5">
        <h1 class="text-lg font-extrabold tracking-tight">
          Tim Marsha
        </h1>

        <p class="mt-1 text-sm text-slate-500">
          Anggota
        </p>
      </div>

      <p id="members-status"
        class="mb-3 text-sm text-slate-500"
        aria-live="polite">
        Memuat anggota....
      </p>

      <ul id="members-list"
        class="space-y-1"
        aria-label="Daftar anggota">
      </ul>

      <p id="members-error"
        class="mt-3 hidden rounded-lg bg-red-50 p-3 text-sm text-red-700"
        role="alert">
      </p>

    </aside>

    <!-- DAFTAR TUGAS -->
    <section class="min-w-0 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

      <!-- HEADER -->
      <header class="border-b border-slate-200 p-5 md:p-6">

        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

          <div>
            <h2 id="tasks-heading"
              class="text-xl font-extrabold tracking-tight">
              Pilih anggota tim
            </h2>

            <p id="progress"
              class="mt-1 text-sm text-slate-500"
              aria-live="polite">
              Pilih nama anggota untuk melihat tugas.
            </p>
          </div>

          <div class="h-2 w-full overflow-hidden rounded-full bg-slate-200 sm:w-44">
            <div id="progress-bar"
              class="h-full w-0 rounded-full bg-emerald-500 transition-all duration-300">
            </div>
          </div>

        </div>
      </header>

      <!-- KONTEN TUGAS -->
      <div class="space-y-4 p-4 md:p-6">

        <!-- PENCARIAN DAN TAMBAH TUGAS -->
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-[minmax(180px,0.8fr)_minmax(220px,1.6fr)_auto]">

          <label class="sr-only" for="search-input">
            Cari judul tugas
          </label>

          <input id="search-input"
            type="search"
            placeholder="Cari judul tugas"
            class="w-full rounded-lg border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100">

          <form id="add-form" class="contents">

            <label class="sr-only" for="new-task-input">
              Judul tugas baru
            </label>

            <input id="new-task-input"
              type="text"
              minlength="5"
              placeholder="Tambah tugas baru, minimal 5 karakter"
              class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-100">

            <button id="save-button"
              type="submit"
              class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
              Simpan
            </button>

          </form>
        </div>

        <!-- PESAN ERROR FORM -->
        <p id="form-error"
          class="hidden text-sm text-grey-600"
          role="alert">
        </p>

        <!-- NOTIFIKASI -->
        <p id="notification"
          class="hidden rounded-lg bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700"
          role="status"
          aria-live="polite">
        </p>

        <!-- JUDUL DAFTAR TUGAS -->
        <div class="flex items-center justify-between">

          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
            Daftar tugas
          </p>

          <p id="task-count" class="text-xs text-slate-400"></p>

        </div>

        <!-- STATUS LOADING -->
        <p id="tasks-status"
          class="hidden py-2 text-center text-sm text-slate-500"
          aria-live="polite">
        </p>

        <!-- PESAN KONEKSI TERPUTUS + TOMBOL COBA LAGI -->
        <div id="tasks-error"
          class="hidden rounded-lg bg-white p-3"
          role="alert"
          aria-live="assertive">

          <p id="tasks-error-message"
            class="mb-2 text-sm text-grey-700">
            Koneksi internet tidak terdeteksi. Periksa jaringan Anda.
          </p>

          <button id="retry-button"
            type="button"
            class="rounded-md border border-slate-300 bg-white px-3 py-1 text-xs font-medium text-slate-600 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-50">

            Coba lagi

          </button>

        </div>

        <!-- DAFTAR TUGAS -->
        <ul id="tasks-list"
          class="divide-y divide-slate-100">
        </ul>

        <!-- PENCARIAN KOSONG -->
        <p id="empty-search"
          class="hidden py-6 text-center text-sm text-slate-500">
          Tidak ada tugas yang cocok.
        </p>

      </div>
    </section>

  </main>

  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
